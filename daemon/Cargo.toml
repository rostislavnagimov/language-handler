[package]
name = "lh-daemon"
version.workspace = true
edition.workspace = true

[lints.rust]
unexpected_cfgs = "allow"

[[bin]]
name = "lh-daemon"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
cocoa.workspace = true
objc.workspace = true

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true